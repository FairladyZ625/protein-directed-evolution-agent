version: 1
amino_acids:
  A: {name: Alanine, hydrophobicity: 1.8, charge: 0, size: small, polarity: nonpolar}
  C: {name: Cysteine, hydrophobicity: 2.5, charge: 0, size: medium, polarity: polar}
  D: {name: Aspartic acid, hydrophobicity: -3.5, charge: -1, size: medium, polarity: polar}
  E: {name: Glutamic acid, hydrophobicity: -3.5, charge: -1, size: medium, polarity: polar}
  F: {name: Phenylalanine, hydrophobicity: 2.8, charge: 0, size: large, polarity: nonpolar}
  G: {name: Glycine, hydrophobicity: -0.4, charge: 0, size: small, polarity: nonpolar}
  H: {name: Histidine, hydrophobicity: -3.2, charge: 0, size: medium, polarity: polar}
  I: {name: Isoleucine, hydrophobicity: 4.5, charge: 0, size: large, polarity: nonpolar}
  K: {name: Lysine, hydrophobicity: -3.9, charge: 1, size: large, polarity: polar}
  L: {name: Leucine, hydrophobicity: 3.8, charge: 0, size: large, polarity: nonpolar}
  M: {name: Methionine, hydrophobicity: 1.9, charge: 0, size: large, polarity: nonpolar}
  N: {name: Asparagine, hydrophobicity: -3.5, charge: 0, size: medium, polarity: polar}
  P: {name: Proline, hydrophobicity: -1.6, charge: 0, size: medium, polarity: nonpolar}
  Q: {name: Glutamine, hydrophobicity: -3.5, charge: 0, size: medium, polarity: polar}
  R: {name: Arginine, hydrophobicity: -4.5, charge: 1, size: large, polarity: polar}
  S: {name: Serine, hydrophobicity: -0.8, charge: 0, size: small, polarity: polar}
  T: {name: Threonine, hydrophobicity: -0.7, charge: 0, size: medium, polarity: polar}
  V: {name: Valine, hydrophobicity: 4.2, charge: 0, size: large, polarity: nonpolar}
  W: {name: Tryptophan, hydrophobicity: -0.9, charge: 0, size: large, polarity: nonpolar}
  Y: {name: Tyrosine, hydrophobicity: -1.3, charge: 0, size: large, polarity: polar}
blosum62:
  # Standard matrix entries needed for classifying substitutions; diagonal is 4/5.
  A: {A: 4, V: 0, G: 0, I: -1, L: -1, D: -2, E: -1, S: 1, T: 0}
  V: {V: 4, I: 3, L: 1, A: 0, M: 1, F: -1, T: 0, G: -3, D: -3, E: -2}
  D: {D: 6, E: 2, N: 1, G: -1, A: -2, V: -3, I: -3, F: -3}
  E: {E: 5, D: 2, Q: 2, N: 0, A: -1, V: -2, I: -3, F: -3}
  G: {G: 6, A: 0, S: 0, V: -3, D: -1, I: -4, F: -3}
  I: {I: 4, V: 3, L: 2, M: 1, A: -1, F: 0, T: -1, G: -4, D: -3}
  L: {L: 4, I: 2, V: 1, M: 2, F: 0, A: -1, G: -4, D: -4}
  F: {F: 6, Y: 3, W: 1, L: 0, I: 0, V: -1, A: -2, G: -3, D: -3}
  W: {W: 11, F: 1, Y: 2, L: -2, I: -3, V: -3, A: -3, G: -2, D: -1, E: -3}
  Y: {Y: 7, F: 3, W: 2, L: -1, I: -1, V: -1, A: -2, G: -3, D: -3, E: -2}
rules:
  - {id: R-MAX-MUTATIONS, type: max_mutations, limit: 4, note: "At most four substitutions per candidate"}
  - {id: R-NO-STOP, type: alphabet, allowed: "ACDEFGHIKLMNPQRSTVWY", note: "Stop codons and non-standard residues are forbidden"}
  - {id: R-BLOSUM-CONSERVATIVE, type: blosum, min_score: 1, note: "BLOSUM62 score >= 1 is a conservative substitution"}
  - {id: R-BLOSUM-AGGRESSIVE, type: blosum, max_score: -1, note: "BLOSUM62 score <= -1 is an aggressive substitution"}
  - {id: R-GB1-SITES, type: positions, allowed: [39, 40, 41, 54], wild_type: {39: V, 40: D, 41: G, 54: V}, note: "GB1 variable sites"}
  - {id: R-PRIORITIZE-HISTORICAL, type: historical, note: "Prefer combinations containing historically high-fitness single mutants"}
