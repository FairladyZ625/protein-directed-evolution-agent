# workflow 的 name 必须与文件名 stem 一致(都是 ci):Harness 拉取观测时按文件名
# 查询(`gh run list --workflow ci.yml`),而校验见证时比对的是运行摘要里的
# workflowName(即本字段),两边必须都落在 settings.ci.workflows 里。
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Lightweight deps only. The data-pipeline / predictor tests need the 44 MB
      # GB1 landscape (intentionally not committed, see data/README.md) and ESM-2 /
      # torch, so they run locally; CI covers the self-contained modules.
      #
      # 门控范围以前只有三个文件(events / knowledge / agent),结果 tests/test_demo_app.py
      # 坏了很久都没人发现——没被门控的测试等于不存在(fact F-89963893)。同一机制此后又生效
      # 两次:扩门时写下了注释却仍没把 test_demo_app.py 加进清单;以及这份手写依赖清单与
      # requirements.txt 漂移,agent/pipeline.py 顶部的 pydantic_ai 没被装上,三个测试文件在
      # collection 阶段就 ImportError——被「门控」的测试其实一个都没跑,CI 照样报绿。
      #
      # 第三次漂移是 xgboost:requirements.txt 钉着 xgboost==3.4.1,手写清单里没有,于是
      # tests/test_predictor.py 两条用例在 main 上持续红,连带卡住所有 standard-task 的 ci 完成门。
      #
      # 现在按当时就写下的根治方向改掉:直接从仓库自己声明的依赖文件安装,不再维护第二份清单。
      # requirements.txt 是轻量档(12 个包,含 xgboost,不含 torch / fair-esm);独立的 openai 包
      # 由 pydantic-ai-slim[openai] 的 extra 带入(干净 venv 实测 openai 3.13.0 就位)。
      # 重依赖 torch / fair-esm 在 requirements-full.txt,故意不装(2GB,且门控范围不含需要它们的测试)。
      # 需要 44MB GB1 地形或 ESM-2 的测试仍在本地跑;下面只列不需要它们的自包含测试,
      # 新增自包含测试文件时必须同步加进来,否则它同样会静默腐烂。
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run self-contained tests
        run: |
          pytest -q \
            tests/test_events.py \
            tests/test_knowledge.py \
            tests/test_agent.py \
            tests/test_campaign.py \
            tests/test_demo.py \
            tests/test_demo_app.py \
            tests/test_timeline.py \
            tests/test_predictor.py

      # 产出 Harness 任务完成门所需的 CI 见证。只在测试通过后运行,因此工件的存在
      # 本身就与绿色运行绑定;pass/fail 由 GitHub 运行的 conclusion 判定。
      - name: Emit Harness CI observation
        run: python tools/write_ci_observation.py
      - name: Upload Harness CI observation
        uses: actions/upload-artifact@v4
        with:
          name: ci-observation-${{ github.run_id }}-${{ github.run_attempt }}-test
          path: tmp/ci-observation/observation.json
          if-no-files-found: error
