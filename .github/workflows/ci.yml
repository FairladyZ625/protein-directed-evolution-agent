# workflow 的 name 必须与文件名 stem 一致(都是 ci):Harness 拉取观测时按文件名
# 查询(`gh run list --workflow ci.yml`),而校验见证时比对的是运行摘要里的
# workflowName(即本字段),两边必须都落在 settings.ci.workflows 里。
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Lightweight deps only. The data-pipeline / predictor tests need the 44 MB
      # GB1 landscape (intentionally not committed, see data/README.md) and ESM-2 /
      # torch, so they run locally; CI covers the self-contained modules.
      #
      # 门控范围以前只有三个文件(events / knowledge / agent),结果 tests/test_demo_app.py
      # 坏了很久都没人发现——没被门控的测试等于不存在(fact F-6B21C4E8)。
      #
      # 上一轮扩门时写下了这段注释,却仍然没有把 test_demo_app.py 本身加进清单,于是同一个
      # 机制第三次生效:事件流被 gzip 归档后,看板的回放面板整块失效、预设按钮是死键、
      # 自动推荐要跑 90 秒,而 test_demo_app.py 里那条本该拦住的断言一直是红的——
      # 只是从没有人跑它,CI 照样报绿。诊断出机制、写下注释,不等于关上门。下面按
      # 「不需要 44MB 地形、不需要 torch」这一条标准把所有自包含测试都列进来;
      # 新增自包含测试文件时必须同步加到这里,否则它同样会静默腐烂。
      # 这份手写清单与 requirements.txt 漂移过一次,代价是 CI 连续多次 push 全红而没人发现:
      # agent/pipeline.py 顶部 `from pydantic_ai import Agent`,清单里却没有 pydantic-ai,
      # 于是 test_agent / test_campaign / test_demo 三个文件在 collection 阶段就 ImportError
      # ——被「门控」的测试其实一个都没跑(同 fact F-6B21C4E8 的机制,只是换了一层)。
      #
      # 根治方向是让 CI 从仓库自己声明的依赖文件安装,而不是在这里维护第二份清单。
      # 等轻量/完整依赖分档(requirements.txt / requirements-full.txt)合入后,
      # 这一步应改成 `pip install -r requirements.txt`;在那之前手写清单必须与
      # 被门控测试的实际 import 保持一致。torch / fair-esm 故意不装(2GB,且门控范围
      # 不含需要它们的测试)。
      - name: Install dependencies
        run: pip install pytest numpy pandas scipy scikit-learn PyYAML networkx pydantic streamlit matplotlib "pydantic-ai-slim[openai]" openai
      - name: Run self-contained tests
        run: |
          pytest -q \
            tests/test_events.py \
            tests/test_knowledge.py \
            tests/test_agent.py \
            tests/test_campaign.py \
            tests/test_demo.py \
            tests/test_demo_app.py \
            tests/test_predictor.py

      # 产出 Harness 任务完成门所需的 CI 见证。只在测试通过后运行,因此工件的存在
      # 本身就与绿色运行绑定;pass/fail 由 GitHub 运行的 conclusion 判定。
      - name: Emit Harness CI observation
        run: python tools/write_ci_observation.py
      - name: Upload Harness CI observation
        uses: actions/upload-artifact@v4
        with:
          name: ci-observation-${{ github.run_id }}-${{ github.run_attempt }}-test
          path: tmp/ci-observation/observation.json
          if-no-files-found: error
