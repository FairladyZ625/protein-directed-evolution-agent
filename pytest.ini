[pytest]
# 只从 tests/ 收集。原因不是洁癖:reports/final-report-v0.7/evidence/code-v09/tests/ 下有三个
# 与 tests/ 完全同名的文件(test_auto_researcher_backtrack / test_auto_researcher_contract /
# test_reflexion),两边都没有 __init__.py,于是 pytest 全量收集时按 basename 导入撞名
# ("import file mismatch"),把**两边**都判成 collection error —— 09-13 的 fbfd5c6 交付 v0.7
# 证据包时带进来的,此后 `pytest -q` 全量一直是 4 errors 起不来,而 CI 只点名跑 8 个自包含
# 文件,所以没有任何门发现它(同 fact F-89963893 的机制第四次发作)。
#
# 证据副本是交付物的一部分,必须留在仓库里,所以这里把收集范围钉死在 tests/,而不是去动
# 那份副本。新增测试目录时要显式加进 testpaths。
testpaths = tests
norecursedirs = reports .worktrees .venv harness tmp artifacts data
